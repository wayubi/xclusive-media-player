server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(mp4|webm|mkv|mov|m4v)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        
        # Allow browser to request specific byte ranges for efficient metadata loading
        max_ranges 100;
        
        # Throttle large files to protect 5400 RPM drives
        # First 10MB at full speed (for thumbnails/metadata), then 50MB/s sustained
        limit_rate_after 10m;
        limit_rate 50m;
        
        aio threads;
        sendfile on;
        sendfile_max_chunk 2m;
        
        try_files $uri =404;
    }

    location ~* \.(mp3|wav|ogg|flac)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        
        max_ranges 50;
        
        limit_rate_after 5m;
        limit_rate 20m;
        
        aio threads;
        sendfile on;
        
        try_files $uri =404;
    }

    location /cache/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /tmp/audio-covers/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Specific location for post-handler.php (streaming support) - must be before generic .php
    location = /post-handler.php {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Disable buffering for polling
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        
        client_max_body_size 100M;
    }

    # Generic PHP location (fallback for all other .php files)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        fastcgi_buffer_size 64k;
        fastcgi_buffers 8 64k;
        fastcgi_busy_buffers_size 128k;
        
        fastcgi_read_timeout 120s;
        fastcgi_keep_conn on;
        
        client_max_body_size 100M;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
