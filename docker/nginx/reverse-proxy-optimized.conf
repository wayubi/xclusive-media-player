# your-domain.com - Optimized Reverse Proxy Configuration
# 
# Features:
# - HTTP/2 support for multiplexing multiple video streams
# - Hybrid caching: cache smaller files, stream larger files directly
# - Optimized for common small/large video file distributions
# - Configurable threshold protects reverse proxy memory from large file bloat
#
# To use: Copy this file to your reverse proxy nginx config location
# and replace your existing server blocks with these

# ============================================
# HTTP Server - Redirect to HTTPS + ACME challenges
# ============================================
server {
    listen 80;
    server_name your-domain.com;

    # ACME challenges for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# HTTPS Server - Main Application
# ============================================
server {
    listen 443 ssl http2;  # Added http2 for connection multiplexing
    server_name your-domain.com;

    # SSL Certificates
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    # DNS Resolver (for backend resolution)
    resolver 127.0.0.11 valid=10s;

    # Security - Allow only your local network
    # include /path/to/allowed.conf;
    # deny all; # optional, configure your access rules

    # ============================================
    # VIDEO FILES - Hybrid Caching Strategy
    # Cache smaller files in RAM (configurable)
    # Stream larger files directly (no RAM usage)
    # ============================================
    location ~* \.(mp4|webm|mkv|avi|mov|flv)$ {
        
        # CRITICAL: Disable buffering - stream directly without loading into RAM
        proxy_buffering off;
        proxy_request_buffering off;
        
        # HYBRID CACHING: Only cache files below a configurable size
        # This uses nginx's ability to check upstream response headers
        proxy_cache media_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        
        # Cache key includes file size indicator when available
        proxy_cache_key "$scheme$request_method$host$request_uri$http_range";
        
        # Add cache status header for debugging
        add_header X-Proxy-Cache $upstream_cache_status;
        
        # HTTP/2 and keepalive for efficient streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Pass through range requests (critical for video seeking)
        proxy_set_header Range $http_range;
        proxy_set_header Accept-Ranges bytes;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Backend (your docker nginx)
        set $backend "http://your-backend-service";
        proxy_pass $backend;
        
        # Cache control headers
        add_header Cache-Control "public, max-age=604800";
    }

    # ============================================
    # AUDIO FILES - Stream directly (no caching)
    # Audio files are typically small but frequent
    # ============================================
    location ~* \.(mp3|wav|ogg|flac|m4a|aac)$ {
        proxy_buffering off;
        proxy_cache off;  # Don't cache audio to save RAM for videos
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Range $http_range;
        proxy_set_header Accept-Ranges bytes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $backend "http://your-backend-service";
        proxy_pass $backend;
        
        add_header Cache-Control "public, max-age=604800";
    }

    # ============================================
    # IMAGES & FONTS - Cache aggressively for 30 days
    # These files don't change often
    # ============================================
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff2?|ttf|eot)$ {
        proxy_cache media_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        proxy_buffering on;  # OK to buffer small static files
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $backend "http://your-backend-service";
        proxy_pass $backend;
        
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # ============================================
    # CSS & JS - No caching, pass through
    # ============================================
    location ~* \.(css|js)$ {
        proxy_cache off;
        proxy_buffering off;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $backend "http://your-backend-service";
        proxy_pass $backend;
    }

    # ============================================
    # PHP/API REQUESTS - No caching, pass through
    # ============================================
    location ~ \.php$ {
        proxy_cache off;
        proxy_buffering off;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $backend "http://your-backend-service";
        proxy_pass $backend;
    }

    # ============================================
    # DEFAULT LOCATION - Catch-all
    # ============================================
    location / {
        proxy_cache off;
        proxy_buffering off;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        set $backend "http://your-backend-service";
        proxy_pass $backend;
    }
}

# ============================================
# NOTES FOR DEPLOYMENT
# ============================================
# 
# 1. HTTP/2 Benefits:
#    - Multiple videos can stream over single connection
#    - Reduces Firefox "Blocked" status for concurrent requests
#    - Better performance for grid views (3x2, 5x2, etc.)
#
# 2. Hybrid Caching Strategy:
#    - Smaller files: Cached in RAM (adjust size according to your server memory)
#    - Larger files: Streamed directly (no RAM usage)
#    - Adjust thresholds according to your file size distribution
#
# 3. Buffering Disabled:
#    - Videos stream directly without loading into reverse proxy RAM
#    - Reduces latency and prevents memory bloat
#
# 4. Range Request Passthrough:
#    - Critical for video seeking/scrubbing
#    - Allows browser to request specific byte ranges
#
# 5. To Deploy:
#    - Copy this file to your nginx config directory (e.g., /etc/nginx/sites-available/)
#    - Symlink to enable it (e.g., ln -s /etc/nginx/sites-available/your-config.conf /etc/nginx/sites-enabled/)
#    - Test: nginx -t
#    - Reload: systemctl reload nginx
#
# 6. Cache Configuration:
#    - Ensure your reverse proxy has sufficient RAM for caching (e.g., via tmpfs or local disk)
#    - Define a cache zone 'media_cache' in your nginx.conf http block with an appropriate max_size
#      e.g., proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:100m max_size=<adjustable> inactive=7d use_temp_path=off;
