#version: "3.9"

services:

  nginx:
    image: nginx
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    depends_on:
      - php-fpm
      - php-cli
    ports:
      - "8050:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
      - ./volumes:/var/www/html/volumes
    networks:
      - app_network

  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/.env:ro
      - ./data/db:/var/www/db
      - ./volumes:/var/www/html/volumes
    networks:
      - app_network

  php-cli:
    build:
      context: ./docker/php-cli
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/.env:ro
      - ./data/db:/var/www/db
      - ./volumes:/var/www/html/volumes
    command: ["php", "-S", "0.0.0.0:8080", "api.php"]
    networks:
      - app_network

networks:
  app_network: